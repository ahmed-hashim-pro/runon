[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runon"
version = "0.14.0"
description = "Keep your operational procedures as plain shell scripts, and run any of them identically on your laptop, one server, or a named group of servers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ahmed Hashim" }]
keywords = ["cli", "ssh", "ops", "runbook", "automation", "fleet", "shell"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
]

# Nothing to install on a supported modern Python: everything runon needs is in
# the standard library, and transport is the system's own ssh/scp — which is the
# point, because your ~/.ssh/config, your agent, your jump hosts and your keys
# already work.
#
# The one exception is 3.10, which has no tomllib. `pip install runon` on Ubuntu
# 22.04 — still the most widely deployed LTS — used to fail with "No matching
# distribution found", which reads as the package not existing rather than as a
# Python too old to take it. tomli is the same parser tomllib was adopted from,
# and it is pulled in only where the standard library is missing it.
dependencies = ["tomli>=1.1.0; python_version < '3.11'"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.6"]

[project.urls]
Homepage = "https://github.com/ahmed-hashim-pro/runon"
Repository = "https://github.com/ahmed-hashim-pro/runon"

[project.scripts]
runon = "runon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# Shipped so a system-wide or `pip install --user` install needs no command at
# all: those land under a prefix the shells already read. A venv or pipx
# install puts them inside the venv, where nothing reads them — that case is
# covered by the first run instead. Kept honest by test_shipped_completions.
[tool.setuptools.data-files]
"share/bash-completion/completions" = ["share/bash-completion/completions/runon"]
"share/zsh/site-functions" = ["share/zsh/site-functions/_runon"]
"share/fish/vendor_completions.d" = ["share/fish/vendor_completions.d/runon.fish"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
