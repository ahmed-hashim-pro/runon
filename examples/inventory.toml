# A worked example. Nothing here is real — replace it with your own machines.
#
# `address` is passed to ssh untouched, so a Host alias from your ~/.ssh/config
# works here just as well as user@1.2.3.4.

[hosts.web-1]
address = "web-1.example.com"
user = "deploy"
vars = { role = "web", datacentre = "eu-west" }

[hosts.web-2]
address = "web-2.example.com"
user = "deploy"
vars = { role = "web", datacentre = "eu-west" }

[hosts.db-1]
address = "10.0.0.9"
user = "deploy"
port = 2222
vars = { role = "database" }

[groups.web]
hosts = ["web-1", "web-2"]

[groups.production]
hosts = ["web-1", "web-2", "db-1"]
