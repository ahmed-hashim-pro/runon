name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      # No servers, no SSH keys, no network: everything that would reach another
      # machine goes through Transport, and the suite drives the fake one.
      - name: Test
        run: pytest

      # The README's own quickstart, executed. If `init` ever stops producing
      # something that runs, this fails rather than the first user finding out.
      - name: Quickstart works from a clean directory
        shell: bash
        run: |
          mkdir -p /tmp/runon-ci && cd /tmp/runon-ci
          runon init
          runon list programs
          runon local run-program --program hello-world --verbose

  # `pip install -e .` runs from the source tree, so it hides packaging
  # mistakes: a module missing from the wheel, a broken entry point, a template
  # that only exists on disk. This installs the built artefact into a clean
  # environment and drives it the way a first-time user would.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the wheel
        run: |
          pip install build
          python -m build

      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl

      # The claim on the tin: nothing but runon itself gets installed.
      # Version-agnostic on purpose: hardcoding the number here means the next
      # release breaks a check that has nothing to do with versions.
      - name: It really has no runtime dependencies
        run: |
          installed=$(/tmp/clean/bin/pip list --format=freeze | grep -viE '^(pip|setuptools|wheel)==' || true)
          echo "installed: $installed"
          test "$(echo "$installed" | wc -l)" -eq 1
          echo "$installed" | grep -q "^runon=="

      - name: A first-time user's session
        run: |
          mkdir -p /tmp/first-run && cd /tmp/first-run
          /tmp/clean/bin/runon --version
          /tmp/clean/bin/runon init
          /tmp/clean/bin/runon list programs
          /tmp/clean/bin/runon local run-program --program hello-world --verbose

      # Before init there is nothing to run; the message must say what to do
      # rather than reporting an empty list.
      - name: The unset-up case explains itself
        run: |
          mkdir -p /tmp/empty && cd /tmp/empty
          output=$(/tmp/clean/bin/runon local run-program --program anything 2>&1 || true)
          echo "$output"
          echo "$output" | grep -q "runon init"
