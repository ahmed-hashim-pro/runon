name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      # No servers, no SSH keys, no network: everything that would reach another
      # machine goes through Transport, and the suite drives the fake one.
      - name: Test
        run: pytest

      # The README's own quickstart, executed -- two commands, no setup step.
      # If that ever stops being true, this fails rather than a first user
      # finding out.
      - name: The quickstart is still two commands
        shell: bash
        run: |
          cd /
          runon list programs
          runon local run-program hello-world --verbose

  # `pip install -e .` runs from the source tree, so it hides packaging
  # mistakes: a module missing from the wheel, a broken entry point, a template
  # that only exists on disk. This installs the built artefact into a clean
  # environment and drives it the way a first-time user would.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the wheel
        run: |
          pip install build
          python -m build

      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl

      # The claim on the tin: nothing but runon itself gets installed.
      # Version-agnostic on purpose: hardcoding the number here means the next
      # release breaks a check that has nothing to do with versions.
      - name: It really has no runtime dependencies
        run: |
          installed=$(/tmp/clean/bin/pip list --format=freeze | grep -viE '^(pip|setuptools|wheel)==' || true)
          echo "installed: $installed"
          test "$(echo "$installed" | wc -l)" -eq 1
          echo "$installed" | grep -q "^runon=="

      # Nothing set up at all: no init, no config, no workspace. This is the
      # claim the fixed default makes, so it is checked before anything else.
      - name: It works on a machine where nothing has been done
        env:
          RUNON_HOME: /tmp/untouched
        run: |
          cd /
          /tmp/clean/bin/runon --version
          /tmp/clean/bin/runon list programs | grep -q hello-world
          /tmp/clean/bin/runon local run-program hello-world --verbose
          test -d /tmp/untouched/workspace/programs/hello-world

      # `runon list` is parsed by the completion scripts, so stdout has to be
      # names and nothing else -- an explanation there gets offered as a
      # program name in your shell.
      - name: An empty workspace puts nothing on stdout
        run: |
          mkdir -p /tmp/hollow/programs
          out=$(/tmp/clean/bin/runon -C /tmp/hollow list programs 2>/dev/null)
          test -z "$out"

      # The completion scripts shell out to runon, so this checks the whole
      # path: script -> command -> workspace -> names back into the shell.
      - name: Completion actually completes
        run: |
          export PATH="/tmp/clean/bin:$PATH"
          runon completion bash > /tmp/runon.bash
          cat > /tmp/drive.sh <<'EOF'
          source /tmp/runon.bash
          COMP_WORDS=(runon local run-program "")
          COMP_CWORD=3
          COMPREPLY=()
          _runon
          printf '%s\n' "${COMPREPLY[@]}"
          EOF
          reply=$(bash /tmp/drive.sh)
          echo "$reply"
          echo "$reply" | grep -qx hello-world

      - name: Moving the workspace is remembered
        run: |
          /tmp/clean/bin/runon init /tmp/ops
          grep -q '/tmp/ops' "$HOME/.runon/config.toml"
          cd /
          /tmp/clean/bin/runon config | grep -q '/tmp/ops'
