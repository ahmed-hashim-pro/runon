name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # zsh drives its own completion tests, and the Linux runners do not have
      # it. Without this they skip there and only macOS ever proves that half.
      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      # No servers, no SSH keys, no network: everything that would reach another
      # machine goes through Transport, and the suite drives the fake one.
      - name: Test
        run: pytest

      # The README's own quickstart, executed -- two commands, no setup step.
      # If that ever stops being true, this fails rather than a first user
      # finding out.
      - name: The quickstart is still two commands
        shell: bash
        run: |
          cd /
          runon list programs
          runon local run-program hello-world --verbose

  # `pip install -e .` runs from the source tree, so it hides packaging
  # mistakes: a module missing from the wheel, a broken entry point, a template
  # that only exists on disk. This installs the built artefact into a clean
  # environment and drives it the way a first-time user would.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the wheel
        run: |
          pip install build
          python -m build

      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl

      # The claim on the tin: nothing but runon itself gets installed.
      # Version-agnostic on purpose: hardcoding the number here means the next
      # release breaks a check that has nothing to do with versions.
      - name: It really has no runtime dependencies
        run: |
          installed=$(/tmp/clean/bin/pip list --format=freeze | grep -viE '^(pip|setuptools|wheel)==' || true)
          echo "installed: $installed"
          test "$(echo "$installed" | wc -l)" -eq 1
          echo "$installed" | grep -q "^runon=="

      # Nothing set up at all: no init, no config, no workspace. This is the
      # claim the fixed default makes, so it is checked before anything else.
      - name: It works on a machine where nothing has been done
        env:
          RUNON_HOME: /tmp/untouched
        run: |
          cd /
          /tmp/clean/bin/runon --version
          /tmp/clean/bin/runon list programs | grep -q hello-world
          /tmp/clean/bin/runon local run-program hello-world --verbose
          test -d /tmp/untouched/workspace/programs/hello-world

      # `runon list` is parsed by the completion scripts, so stdout has to be
      # names and nothing else -- an explanation there gets offered as a
      # program name in your shell.
      - name: An empty workspace puts nothing on stdout
        run: |
          mkdir -p /tmp/hollow/programs
          out=$(/tmp/clean/bin/runon -C /tmp/hollow list programs 2>/dev/null)
          test -z "$out"

      # The completion scripts shell out to runon, so this checks the whole
      # path: script -> command -> workspace -> names back into the shell.
      # `pip install` cannot register a completion, so the one command that
      # does has to work -- and the result has to be what bash then loads.
      # A --user install needs no command at all: these land under a prefix
      # bash and fish already read.
      - name: The wheel carries completions to where a --user install reads them
        env:
          PYTHONUSERBASE: /tmp/userbase
        run: |
          python -m pip install -q --user --no-warn-script-location dist/*.whl
          test -f /tmp/userbase/share/bash-completion/completions/runon
          test -f /tmp/userbase/share/fish/vendor_completions.d/runon.fish
          test -f /tmp/userbase/share/zsh/site-functions/_runon

      - name: Completion installs itself where bash looks
        env:
          SHELL: /bin/bash
          RUNON_HOME: /tmp/firstrun
        run: |
          # the first command sets it up; nothing is typed to make that happen
          /tmp/clean/bin/runon list programs > /dev/null
          test -f "$HOME/.local/share/bash-completion/completions/runon"
          cat > /tmp/loaded.sh <<'EOF'
          source "$HOME/.local/share/bash-completion/completions/runon"
          COMP_WORDS=(runon "")
          COMP_CWORD=1
          COMPREPLY=()
          _runon
          printf '%s\n' "${COMPREPLY[@]}"
          EOF
          bash /tmp/loaded.sh | grep -qx doctor

      - name: Completion actually completes
        run: |
          export PATH="/tmp/clean/bin:$PATH"
          runon completion bash > /tmp/runon.bash
          cat > /tmp/drive.sh <<'EOF'
          source /tmp/runon.bash
          COMP_WORDS=(runon local run-program "")
          COMP_CWORD=3
          COMPREPLY=()
          _runon
          printf '%s\n' "${COMPREPLY[@]}"
          EOF
          reply=$(bash /tmp/drive.sh)
          echo "$reply"
          echo "$reply" | grep -qx hello-world

      # A run nobody is watching: a stored credential reference, no tty, no
      # prompt. This is the whole point of password_env.
      - name: A password can come from the environment with no terminal
        env:
          RUNON_HOME: /tmp/unattended
          WEB1_PASS: not-a-real-password
        run: |
          /tmp/clean/bin/runon add-host web-1 --address 127.0.0.1 \
            --user nobody --password-env WEB1_PASS < /dev/null
          grep -q 'password_env = "WEB1_PASS"' /tmp/unattended/workspace/inventory.toml
          # the secret itself must not be in the file runon just wrote
          ! grep -q 'not-a-real-password' /tmp/unattended/workspace/inventory.toml

      # runon can hold the password itself. The file it writes must be
      # unreadable by anyone else, and the secret must not reach the inventory.
      - name: A stored password is 0600 and stays out of the workspace
        env:
          RUNON_HOME: /tmp/stored
        run: |
          printf '%s' 'not-a-real-password' | \
            /tmp/clean/bin/runon add-host db-1 --address 10.0.0.9 --password-stdin
          # python rather than stat(1), whose flags differ between GNU and BSD
          mode() { python3 -c "import os,stat,sys;print(oct(stat.S_IMODE(os.stat(sys.argv[1]).st_mode))[2:])" "$1"; }
          test "$(mode /tmp/stored/secrets/db-1)" = "600"
          test "$(mode /tmp/stored/secrets)" = "700"
          ! grep -q 'not-a-real-password' /tmp/stored/workspace/inventory.toml
          grep -q 'password_file' /tmp/stored/workspace/inventory.toml

      - name: An inline password in the inventory is refused
        env:
          RUNON_HOME: /tmp/inline
        run: |
          /tmp/clean/bin/runon list programs > /dev/null
          printf '\n[hosts.bad]\naddress = "10.0.0.1"\npassword = "hunter2"\n' \
            >> /tmp/inline/workspace/inventory.toml
          out=$(/tmp/clean/bin/runon list hosts 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "becomes a password in git"

      # A program that asks for things, run by a scheduler that cannot answer.
      - name: Prompts and confirmations work with nobody watching
        env:
          RUNON_HOME: /tmp/prompted
        run: |
          /tmp/clean/bin/runon list programs > /dev/null
          d=/tmp/prompted/workspace/programs/asker
          mkdir -p "$d"
          printf '#!/bin/sh\necho "b=$RUNON_PROMPT_BRANCH"\n' > "$d/main.sh"
          chmod +x "$d/main.sh"
          printf 'destructive = true\n' > "$d/meta.toml"
          printf '[[prompt]]\nkey = "branch"\ndefault = "main"\n' > "$d/prompts.toml"

          # destructive: refuses rather than agreeing for you
          ! /tmp/clean/bin/runon local run-program asker -v < /dev/null

          # says it means it, and the default answers the prompt
          out=$(RUNON_ASSUME_YES=1 /tmp/clean/bin/runon local run-program asker -v < /dev/null)
          echo "$out" | grep -q "b=main"

          # --yes is the same agreement, on the command line
          out=$(/tmp/clean/bin/runon local run-program asker -v --yes < /dev/null 2>&1)
          echo "$out" | grep -q "b=main"
          # the warning is still printed, or the log cannot say what it agreed to
          echo "$out" | grep -q "DESTRUCTIVE"

          # the environment beats the default
          out=$(RUNON_ASSUME_YES=1 RUNON_PROMPT_BRANCH=hotfix \
                /tmp/clean/bin/runon local run-program asker -v < /dev/null)
          echo "$out" | grep -q "b=hotfix"

      # The picker draws escape sequences. None of them may reach something
      # that is not a terminal -- a log, a pipe, a CI job.
      - name: The picker declines when there is no terminal
        env:
          RUNON_HOME: /tmp/plain
        run: |
          /tmp/clean/bin/runon list programs > /dev/null
          /tmp/clean/bin/runon new-program second < /dev/null
          out=$(/tmp/clean/bin/runon local run-program < /dev/null 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q -- "--program"
          ! printf '%s' "$out" | grep -q "$(printf '\033')"

      - name: Moving the workspace is remembered
        run: |
          /tmp/clean/bin/runon init /tmp/ops
          grep -q '/tmp/ops' "$HOME/.runon/config.toml"
          cd /
          /tmp/clean/bin/runon config | grep -q '/tmp/ops'
